name: Windows MSYS2

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, devel ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          mingw-w64-x86_64-ccache
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-cppunit
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-graphviz
          mingw-w64-x86_64-jsoncpp
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-qt5-xmlpatterns

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-msys2-ccache-${{ hashFiles('.github/workflows/windows-msys2.yml', '.github/workflows/cmake-windows-cache.cmake') }}
        max-size: 1G
        ccache-command: ccache

    - name: Download cisstNetlib
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        github_env="$(cygpath -u "${GITHUB_ENV}")"
        git clone --depth 1 https://github.com/jhu-cisst/cisstNetlib "${workspace}/../cisstNetlib-source"
        echo "CISSTNETLIB_HASH=$(git -C "${workspace}/../cisstNetlib-source" rev-parse HEAD)" >> "${github_env}"

    - name: Cache cisstNetlib build
      id: cache-cisstnetlib
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/../cisstNetlib-install
        key: ${{ runner.os }}-msys2-cisstnetlib-${{ env.CISSTNETLIB_HASH }}

    - name: Build cisstNetlib
      if: steps.cache-cisstnetlib.outputs.cache-hit != 'true'
      env:
        CFLAGS: -std=gnu17
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cmake -S "${workspace}/../cisstNetlib-source" \
          -B "${workspace}/../cisstNetlib-build" \
          -G "Ninja Multi-Config" \
          -DCMAKE_INSTALL_PREFIX="${workspace}/../cisstNetlib-install" \
          -DcisstNetlib_LANGUAGE=C \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_FLAGS=-std=gnu17
        cmake --build "${workspace}/../cisstNetlib-build" --config Release --parallel "$(nproc)"
        cmake --install "${workspace}/../cisstNetlib-build" --config Release

    - name: Configure CMake
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cmake -S "${workspace}" \
          -B "${workspace}/build" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCisstNetlib_DIR="${workspace}/../cisstNetlib-install/share/cisstNetlib" \
          -C "${workspace}/.github/workflows/cmake-windows-cache.cmake"

    - name: Build
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cmake --build "${workspace}/build" --parallel "$(nproc)"

    - name: Run Tests
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cd "${workspace}/build"
        export PATH="${PWD}/bin:${PATH}"
        ctest --output-on-failure

    - name: Configure CMake examples
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cmake -S "${workspace}" \
          -B "${workspace}/build" \
          -DCISST_BUILD_EXAMPLES=ON \
          -DCISST_cisstCommon_EXAMPLES=ON \
          -DCISST_cisstVector_EXAMPLES=ON \
          -DCISST_cisstOSAbstraction_EXAMPLES=ON \
          -DCISST_cisstNumerical_EXAMPLES=ON \
          -DCISST_cisstMultiTask_EXAMPLES=ON \
          -DCISST_cisstParameterTypes_EXAMPLES=ON \
          -DCISST_cisstRobot_EXAMPLES=ON \
          -DCISST_cisstMesh_EXAMPLES=ON

    - name: Build examples
      run: |
        workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
        cmake --build "${workspace}/build" --parallel "$(nproc)"
