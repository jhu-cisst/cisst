name: macOS 15

on:
  push:
    branches: [ main, devel, cisst2 ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Homebrew cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/macos-15.yml') }}
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: Install dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew install graphviz jsoncpp qt pkg-config cppunit ccache eigen orocos-kdl pybind11
        # Ensure homebrew bin is in path for subsequent steps
        echo "/opt/homebrew/bin" >> $GITHUB_PATH

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install NumPy
      run: python -m pip install numpy

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/macos-15.yml') }}
        max-size: 1G
        ccache-command: ccache

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        cmake ${{github.workspace}} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCISST_QT_VERSION=6 \
          -DCISST_HAS_PYTHON=ON \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt;/opt/homebrew" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -C ${{github.workspace}}/.github/workflows/cmake-macos-cache.cmake

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        source cisstvars.sh
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

    - name: Configure CMake examples
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        cmake ${{github.workspace}} \
          -DCISST_BUILD_EXAMPLES=ON \
          -DCISST_cisstCommon_EXAMPLES=ON \
          -DCISST_cisstOSAbstraction_EXAMPLES=ON \
          -DCISST_cisstMultiTask_EXAMPLES=ON \
          -DCISST_cisstParameterTypes_EXAMPLES=ON

    - name: Build examples
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        source cisstvars.sh
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

    - name: Test exported targets against build tree
      shell: bash
      run: |
        mkdir -p ${{github.workspace}}/test_export_build_tree_build
        cd ${{github.workspace}}/test_export_build_tree_build
        cmake ${{github.workspace}}/cisstMultiTask/examples/PeriodicTask \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -Dcisst_DIR=${{github.workspace}}/build
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

    - name: Install cisst
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --install . --prefix ${{github.workspace}}/cisst-install

    - name: Test exported targets against install tree
      shell: bash
      run: |
        CISST_DIR_PATH=$(find ${{github.workspace}}/cisst-install -name "cisst-config.cmake" -exec dirname {} \;)
        echo "Found cisst cmake directory: $CISST_DIR_PATH"
        mkdir -p ${{github.workspace}}/test_export_install_tree_build
        cd ${{github.workspace}}/test_export_install_tree_build
        cmake ${{github.workspace}}/cisstMultiTask/examples/PeriodicTask \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -Dcisst_DIR="$CISST_DIR_PATH"
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        source cisstvars.sh
        ./bin/cisstCommonTests -r -v
        ./bin/cisstVectorQtTests -r -v
        ./bin/cisstOSAbstractionTests -r -v
        ./bin/cisstParameterTypesTests -r -v
        ./bin/cisstMultiTaskTests -r -v
        python ./bin/cisstCommonTests.py -r
        python ./bin/cisstMultiTaskTests.py -r
        python ./bin/cisstParameterTypesTests.py -r
