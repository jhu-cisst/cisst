name: Windows Latest

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, devel ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.*.*'

    - name: Download cisstNetlib
      run: |
        cmake -E make_directory ${{github.workspace}}/cisstNetlib-build
        git clone https://github.com/jhu-cisst/cisstNetlib ${{github.workspace}}/cisstNetlib-source

    - name: Build cisstNetlib
      working-directory: ${{github.workspace}}/cisstNetlib-build
      run: |
        cmake ${{github.workspace}}/cisstNetlib-source
        cmake --build . --config Release
        cmake --build . --target install

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      run: cmake "${{github.workspace}}" -DCMAKE_BUILD_TYPE=Release -C "${{github.workspace}}/.github/workflows/cmake-windows-cache.cmake"

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: |
        ./cisstvars.bat Release
        cmake --build . --config Release

    - name: Configure CMake examples
      working-directory: ${{github.workspace}}/build
      run: |
        cmake "${{github.workspace}}" `
          -DCISST_BUILD_EXAMPLES=ON `
          -DCISST_cisstCommon_EXAMPLES=ON `
          -DCISST_cisstVector_EXAMPLES=ON `
          -DCISST_cisstOSAbstraction_EXAMPLES=ON `
          -DCISST_cisstNumerical_EXAMPLES=ON `
          -DCISST_cisstMultiTask_EXAMPLES=ON `
          -DCISST_cisstParameterTypes_EXAMPLES=ON `
          -DCISST_cisstRobot_EXAMPLES=ON `
          -DCISST_cisstMesh_EXAMPLES=ON

    - name: Build examples
      working-directory: ${{github.workspace}}/build
      run: |
        ./cisstvars.bat Release
        cmake --build . --config Release
