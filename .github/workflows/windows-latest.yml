name: Windows Latest

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, devel ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_ROOT: C:\vcpkg

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: win64_msvc2019_64
        cache: 'true'

    - name: Set up vcpkg binary cache
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/vcpkg_cache"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg_cache" >> "$GITHUB_ENV"

    - name: Cache vcpkg binary artifacts
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json', '.github/workflows/vcpkg-triplets/x64-windows.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-bin-

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Install dependencies via vcpkg
      working-directory: ${{github.workspace}}/build
      run: |
        C:\vcpkg\vcpkg install --triplet x64-windows --overlay-triplets="${{github.workspace}}/.github/workflows/vcpkg-triplets" --x-install-root="${{github.workspace}}/build/vcpkg_installed"

    - name: Configure CMake smoke test
      run: |
        cmake -E make_directory ${{github.workspace}}/build-configure-check
        cd ${{github.workspace}}/build-configure-check
        cmake "${{github.workspace}}" `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
          "-DVCPKG_INSTALLED_DIR=${{github.workspace}}/build/vcpkg_installed" `
          -DVCPKG_MANIFEST_INSTALL=OFF `
          -C "${{github.workspace}}/.github/workflows/cmake-windows-smoke-cache.cmake"

    - name: Download cisstNetlib
      shell: bash
      run: |
        git clone --depth 1 https://github.com/jhu-cisst/cisstNetlib "$GITHUB_WORKSPACE/../cisstNetlib-source"
        echo "CISSTNETLIB_HASH=$(git -C "$GITHUB_WORKSPACE/../cisstNetlib-source" rev-parse HEAD)" >> $GITHUB_ENV

    - name: Cache cisstNetlib build
      id: cache-cisstnetlib
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/../cisstNetlib-install
        key: ${{ runner.os }}-cisstnetlib-${{ env.CISSTNETLIB_HASH }}

    - name: Build cisstNetlib
      if: steps.cache-cisstnetlib.outputs.cache-hit != 'true'
      run: |
        cmake -E make_directory ${{github.workspace}}/../cisstNetlib-build
        cd ${{github.workspace}}/../cisstNetlib-build
        cmake ${{github.workspace}}/../cisstNetlib-source -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/../cisstNetlib-install
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
        cmake --build . --target install

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      run: cmake "${{github.workspace}}" -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=${{github.workspace}}/build/vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF "-DCisstNetlib_DIR=${{github.workspace}}/../cisstNetlib-install/share/cisstNetlib" -C "${{github.workspace}}/.github/workflows/cmake-windows-cache.cmake"

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: |
        call cisstvars.bat Release
        cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

    - name: Configure CMake examples
      working-directory: ${{github.workspace}}/build
      run: |
        cmake "${{github.workspace}}" `
          -DCISST_BUILD_EXAMPLES=ON `
          -DCISST_cisstCommon_EXAMPLES=ON `
          -DCISST_cisstVector_EXAMPLES=ON `
          -DCISST_cisstOSAbstraction_EXAMPLES=ON `
          -DCISST_cisstNumerical_EXAMPLES=ON `
          -DCISST_cisstMultiTask_EXAMPLES=ON `
          -DCISST_cisstParameterTypes_EXAMPLES=ON `
          -DCISST_cisstRobot_EXAMPLES=ON `
          -DCISST_cisstMesh_EXAMPLES=ON

    - name: Build examples
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: |
        call cisstvars.bat Release
        cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

    - name: Test exported targets against build tree
      shell: cmd
      run: |
        mkdir "${{github.workspace}}\test_export_build_tree_build"
        cd "${{github.workspace}}\test_export_build_tree_build"
        cmake "${{github.workspace}}/cisstMultiTask/examples/PeriodicTask" ^
          -DCMAKE_BUILD_TYPE=Release ^
          "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" ^
          "-DVCPKG_INSTALLED_DIR=${{github.workspace}}/build/vcpkg_installed" ^
          -DVCPKG_MANIFEST_INSTALL=OFF ^
          -Dcisst_DIR="${{github.workspace}}/build" ^
          -DcisstNetlib_DIR="${{github.workspace}}/../cisstNetlib-install/share/cisstNetlib"
        cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

    - name: Install cisst
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: |
        cmake --install . --prefix ${{github.workspace}}/cisst-install

    - name: Test exported targets against install tree
      shell: cmd
      run: |
        mkdir "${{github.workspace}}\test_export_install_tree_build"
        cd "${{github.workspace}}\test_export_install_tree_build"
        cmake "${{github.workspace}}/cisstMultiTask/examples/PeriodicTask" ^
          -DCMAKE_BUILD_TYPE=Release ^
          "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" ^
          "-DVCPKG_INSTALLED_DIR=${{github.workspace}}/build/vcpkg_installed" ^
          -DVCPKG_MANIFEST_INSTALL=OFF ^
          -Dcisst_DIR="${{github.workspace}}/cisst-install/share/cisst-1.5/cmake" ^
          -DcisstNetlib_DIR="${{github.workspace}}/../cisstNetlib-install/share/cisstNetlib"
        cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

    - name: Test downstream Qt dependency discovery
      shell: pwsh
      run: |
        $source = "${{github.workspace}}/tests/cmake/qt-dependencies"
        $installedConfig = Get-ChildItem "${{github.workspace}}/cisst-install/share/cisst-*/cmake/cisst-config.cmake" | Select-Object -First 1
        if (-not $installedConfig) { throw "Installed cisst package configuration not found" }
        $packages = @{ build = "${{github.workspace}}/build"; install = $installedConfig.DirectoryName }
        foreach ($tree in @('build', 'install')) {
          foreach ($mode in @('core', 'qt', 'repeated', 'all')) {
            $binary = "${{github.workspace}}/qt-dependencies-$tree-$mode"
            $options = @(
              "-Dcisst_DIR=$($packages[$tree])", "-DMODE=$mode",
              "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake",
              "-DVCPKG_INSTALLED_DIR=${{github.workspace}}/build/vcpkg_installed",
              '-DVCPKG_MANIFEST_INSTALL=OFF',
              "-DCisstNetlib_DIR=${{github.workspace}}/../cisstNetlib-install/share/cisstNetlib"
            )
            if ($mode -eq 'core') {
              $options += '-DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON', '-DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON'
            }
            cmake -S $source -B $binary @options
            if ($LASTEXITCODE -ne 0) { throw "Qt dependency configure failed: $tree/$mode" }
            if ($mode -ne 'all') {
              cmake --build $binary --config Release --parallel 2
              if ($LASTEXITCODE -ne 0) { throw "Qt dependency build failed: $tree/$mode" }
            }
          }
        }

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: |
        call cisstvars.bat Release
        bin\Release\cisstCommonTests.exe -r -v
        bin\Release\cisstVectorTests.exe -r -v
        bin\Release\cisstNumericalTests.exe -r -v
        bin\Release\cisstOSAbstractionTests.exe -r -v
        bin\Release\cisstParameterTypesTests.exe -r -v
        bin\Release\cisstMultiTaskTests.exe -r -v
