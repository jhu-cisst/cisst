name: Windows Latest

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, devel ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_ROOT: C:\vcpkg

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.*.*'

    - name: Set up vcpkg binary cache
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/vcpkg_cache
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_cache" >> $GITHUB_ENV

    - name: Cache vcpkg binary artifacts
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-bin-

    - name: Download cisstNetlib
      shell: bash
      run: |
        git clone --depth 1 https://github.com/jhu-cisst/cisstNetlib ${{github.workspace}}/cisstNetlib-source
        echo "CISSTNETLIB_HASH=$(git -C ${{github.workspace}}/cisstNetlib-source rev-parse HEAD)" >> $GITHUB_ENV

    - name: Cache cisstNetlib build
      id: cache-cisstnetlib
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/cisstNetlib-install
        key: ${{ runner.os }}-cisstnetlib-${{ env.CISSTNETLIB_HASH }}

    - name: Build cisstNetlib
      if: steps.cache-cisstnetlib.outputs.cache-hit != 'true'
      run: |
        cmake -E make_directory ${{github.workspace}}/cisstNetlib-build
        cd ${{github.workspace}}/cisstNetlib-build
        cmake ${{github.workspace}}/cisstNetlib-source -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/cisstNetlib-install
        cmake --build . --config Release --parallel
        cmake --build . --target install

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Install dependencies via vcpkg
      working-directory: ${{github.workspace}}/build
      run: |
        C:\vcpkg\vcpkg install --triplet x64-windows --overlay-triplets="${{github.workspace}}/.github/workflows/vcpkg-triplets" --x-install-root="${{github.workspace}}/build/vcpkg_installed"

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      run: cmake "${{github.workspace}}" -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_OVERLAY_TRIPLETS=${{github.workspace}}/.github/workflows/vcpkg-triplets" -DVCPKG_MANIFEST_INSTALL=OFF "-DCisstNetlib_DIR=${{github.workspace}}/cisstNetlib-install/share/cisstNetlib" -C "${{github.workspace}}/.github/workflows/cmake-windows-cache.cmake"

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: |
        ./cisstvars.bat Release
        cmake --build . --config Release --parallel

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: |
        ./cisstvars.bat Release
        ctest -C Release --output-on-failure

    - name: Configure CMake examples
      working-directory: ${{github.workspace}}/build
      run: |
        cmake "${{github.workspace}}" `
          -DCISST_BUILD_EXAMPLES=ON `
          -DCISST_cisstCommon_EXAMPLES=ON `
          -DCISST_cisstVector_EXAMPLES=ON `
          -DCISST_cisstOSAbstraction_EXAMPLES=ON `
          -DCISST_cisstNumerical_EXAMPLES=ON `
          -DCISST_cisstMultiTask_EXAMPLES=ON `
          -DCISST_cisstParameterTypes_EXAMPLES=ON `
          -DCISST_cisstRobot_EXAMPLES=ON `
          -DCISST_cisstMesh_EXAMPLES=ON

    - name: Build examples
      working-directory: ${{github.workspace}}/build
      run: |
        ./cisstvars.bat Release
        cmake --build . --config Release --parallel
