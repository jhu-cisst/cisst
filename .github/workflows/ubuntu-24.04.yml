name: Ubuntu 24.04

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, devel ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop

    steps:
    - uses: actions/checkout@v4

    - name: Setup ROS 2 Jazzy
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: jazzy

    - name: Ensure cache directory exists
      run: mkdir -p apt-cache

    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: apt-cache
        key: ${{ runner.os }}-apt-jazzy-${{ hashFiles('.github/workflows/cmake-ubuntu-cache.cmake') }}
        restore-keys: |
          ${{ runner.os }}-apt-jazzy-

    - name: Install Dependencies
      run: |
        # Disable the automatic purging of the apt cache in docker images
        rm -f /etc/apt/apt.conf.d/docker-clean
        mkdir -p apt-cache
        APT_CACHE_DIR=$(pwd)/apt-cache
        echo "Dir::Cache::archives \"$APT_CACHE_DIR\";" | tee /etc/apt/apt.conf.d/10cache
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | tee /etc/apt/apt.conf.d/01keep-debs
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          git \
          libxml2-dev \
          libjsoncpp-dev \
          libcppunit-dev \
          qtbase5-dev \
          qtbase5-dev-tools \
          qt5-qmake-bin \
          libqt5xmlpatterns5-dev \
          libgraphviz-dev \
          ccache

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/cmake-ubuntu-cache.cmake') }}
        max-size: 1G

    - name: ccache stats (before)
      run: ccache -s

    - name: Download cisstNetlib
      shell: bash
      run: |
        git clone --depth 1 -b devel https://github.com/jhu-cisst/cisstNetlib ${{github.workspace}}/cisstNetlib-source
        echo "CISSTNETLIB_HASH=$(git -C ${{github.workspace}}/cisstNetlib-source rev-parse HEAD)" >> $GITHUB_ENV

    - name: Cache cisstNetlib build
      id: cache-cisstnetlib
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/cisstNetlib-install
        key: ${{ runner.os }}-cisstnetlib-${{ env.CISSTNETLIB_HASH }}

    - name: Build cisstNetlib
      if: steps.cache-cisstnetlib.outputs.cache-hit != 'true'
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: "true"
        CCACHE_COMPRESS: "true"
      run: |
        mkdir -p ${{github.workspace}}/cisstNetlib-build
        cd ${{github.workspace}}/cisstNetlib-build
        cmake ${{github.workspace}}/cisstNetlib-source \
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/cisstNetlib-install \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build . --config Release --parallel $(nproc)
        cmake --build . --target install

    - name: Create Build Environment
      run: mkdir -p build

    - name: Configure CMake
      shell: bash
      working-directory: build
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: "true"
        CCACHE_COMPRESS: "true"
      run: |
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCisstNetlib_DIR=${{github.workspace}}/cisstNetlib-install/share/cisstNetlib \
          -C ../.github/workflows/cmake-ubuntu-cache.cmake

    - name: Build
      working-directory: build
      shell: bash
      run: cmake --build . --config Release --parallel $(nproc)

    - name: Configure CMake examples
      shell: bash
      working-directory: build
      run: |
        cmake .. \
          -DCISST_BUILD_EXAMPLES=ON \
          -DCISST_cisstCommon_EXAMPLES=ON \
          -DCISST_cisstVector_EXAMPLES=ON \
          -DCISST_cisstOSAbstraction_EXAMPLES=ON \
          -DCISST_cisstNumerical_EXAMPLES=ON \
          -DCISST_cisstMultiTask_EXAMPLES=ON \
          -DCISST_cisstParameterTypes_EXAMPLES=ON \
          -DCISST_cisstRobot_EXAMPLES=ON \
          -DCISST_cisstMesh_EXAMPLES=ON

    - name: Build examples
      working-directory: build
      shell: bash
      run: cmake --build . --config Release --parallel $(nproc)

    - name: Test
      working-directory: build
      shell: bash
      run: |
        source cisstvars.sh
        cisstCommonTests -r
        cisstVectorTests -r
        cisstNumericalTests -r
        cisstOSAbstractionTests -r
        cisstParameterTypesTests -r

    - name: ccache stats (after)
      run: ccache -s
